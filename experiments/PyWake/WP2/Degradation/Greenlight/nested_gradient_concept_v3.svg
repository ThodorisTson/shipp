<text x="460" y="240" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;DejaVu Sans&quot;, sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central">NPV gradient   d NPV / d E_cap</text>
<text x="460" y="260" style="fill:rgba(255, 255, 255, 0.85);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;DejaVu Sans&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:central">how lifetime value responds to a change in capacity,</text>
